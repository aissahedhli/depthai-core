# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-icansii"
BBFILE_PATTERN_meta-icansii = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-icansii = "6"

LAYERDEPENDS_meta-icansii = "core"
LAYERSERIES_COMPAT_meta-icansii = "kirkstone"
